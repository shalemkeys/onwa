{% extends 'base.html' %}
{% block title %}Book Map — Onwa{% endblock %}
{% block body %}
<div class="page">
  <div class="page-header">
    <h1>📍 Book Locations Map</h1>
    <p>See where books are right now across the UK</p>
  </div>

  <div class="card" style="padding:0;overflow:hidden;height:600px">
    <div id="map" style="width:100%;height:100%"></div>
  </div>
</div>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

<script>
const map = L.map('map').setView([54.5973, -3.4360], 6);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap',
  maxZoom: 18
}).addTo(map);

const locations = {{ locations | tojson }};
locations.forEach(loc => {
  const marker = L.circleMarker([loc.lat, loc.lng], {
    radius: 8,
    fillColor: '#f59e0b',
    color: '#d97706',
    weight: 2,
    opacity: 1,
    fillOpacity: 0.8
  }).addTo(map);
  
  marker.bindPopup(`
    <div style="font-size:13px">
      <div style="font-weight:700;margin-bottom:4px">${loc.title}</div>
      <div style="color:#666;font-size:12px;margin-bottom:6px">${loc.holder}</div>
      <div style="font-family:monospace;color:#d97706;font-weight:700;font-size:11px">${loc.code}</div>
    </div>
  `);
});
</script>
{% endblock %}
